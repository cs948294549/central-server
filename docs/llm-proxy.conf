# =============================================================================
# LLM 中转代理：test.org  ->  example/llm
# -----------------------------------------------------------------------------
# 部署路径：/etc/nginx/conf.d/llm-proxy.conf
# 令牌文件：/etc/nginx/secrets/llm_token.conf（模板见 llm_token.conf.example，chmod 600）
#           不要放 conf.d/，否则会被 http 块自动加载导致 set 指令报错
#
# 路径映射：
#   http://test.org/llm/v1/messages  ->  http://example/llm/v1/messages
#
# 客户端（Claude Code）配置：
#   export ANTHROPIC_BASE_URL=http://test.org/llm
#   export ANTHROPIC_AUTH_TOKEN=placeholder     # 必须非空，实际值会被 nginx 覆盖
#   export ANTHROPIC_MODEL=<模型名>             # 走请求 body 的 model 字段，nginx 原样透传
#
# 生效：
#   nginx -t && nginx -s reload
#
# 验证（客户端不带任何凭证，能返回即说明注入生效）：
#   curl -N -v http://test.org/llm/v1/messages \
#     -H 'content-type: application/json' \
#     -H 'anthropic-version: 2023-06-01' \
#     -d '{"model":"<模型名>","max_tokens":64,"messages":[{"role":"user","content":"hi"}]}'
# =============================================================================

# 令牌单独存放，不要写进本文件、不要提交到 git
# 文件内容：set $llm_token "sk-xxxxxxxx";
# 注意：set 只能在 server/location 内使用，所以在 server 块里 include

upstream llm_backend {
    server example:80;
    keepalive 32;
}

server {
    listen 80;
    server_name test.org;

    access_log /var/log/nginx/llm-proxy.access.log;
    error_log  /var/log/nginx/llm-proxy.error.log warn;

    # 请求体上限（长上下文 + 图片时请求很大）
    client_max_body_size 50m;

    # 注入令牌变量
    include /etc/nginx/secrets/llm_token.conf;

    # -------------------------------------------------------------------------
    # 访问控制：本配置会把令牌开放给所有能访问 test.org 的人，务必限制来源
    # -------------------------------------------------------------------------
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny  all;

    # 如需按人鉴权，可再加 basic auth（htpasswd -c /etc/nginx/llm.htpasswd <user>）
    # 注意：开启后客户端 Authorization 头会被 basic auth 占用，Claude Code 需通过
    #       ANTHROPIC_CUSTOM_HEADERS 等方式另行处理，一般建议只用 IP 白名单
    # auth_basic           "LLM Proxy";
    # auth_basic_user_file /etc/nginx/llm.htpasswd;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location /llm/ {
        # 尾斜杠对齐：/llm/xxx → example/llm/xxx
        proxy_pass http://llm_backend/llm/;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host example;   # 上游按 Host 路由，必须改写

        # ---- 凭证注入（覆盖客户端传来的值）----
        # 上游实际认哪种就保留哪种，其余可删除
        proxy_set_header Authorization        "Bearer $llm_token";
        proxy_set_header x-api-key            $llm_token;
        proxy_set_header ANTHROPIC_AUTH_TOKEN $llm_token;

        # 如上游要求通过 header 指定模型，打开下面一行
        # proxy_set_header ANTHROPIC_MODEL "<模型名>";

        # ---- 客户端信息透传 ----
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ---- 流式输出（SSE）必需，缺失会导致客户端"卡住不出字" ----
        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_cache             off;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;

        # ---- 超时：LLM 长输出，默认 60s 必超时 ----
        proxy_connect_timeout 10s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
        send_timeout          600s;
    }

    # 其它路径一律拒绝
    location / {
        return 404;
    }
}

# =============================================================================
# 附：如果上游是 HTTPS，替换 upstream 和 proxy_pass 部分：
#
# upstream llm_backend {
#     server example:443;
#     keepalive 32;
# }
#
#     location /llm/ {
#         proxy_pass https://llm_backend/llm/;
#         proxy_ssl_server_name on;
#         proxy_ssl_name        example;
#         ...其余不变
#     }
#
# 附：如果 test.org 本身要上 HTTPS，在 server 块加：
#     listen 443 ssl;
#     ssl_certificate     /etc/nginx/ssl/test.org.crt;
#     ssl_certificate_key /etc/nginx/ssl/test.org.key;
# =============================================================================
