# 定时任务配置文件
# 支持 cron 和 interval 两种调度方式
#
# Cron 表达式格式: "分 时 日 月 周"
# 示例:
#   "0 2 * * *"     - 每天凌晨2点执行
#   "*/30 * * * *"  - 每30分钟执行一次
#   "0 */2 * * *"   - 每2小时执行一次
#   "0 0 * * 0"     - 每周日凌晨执行
#
# Interval 格式: {hours: 1, minutes: 30, seconds: 0}

tasks:
  # IPAM地址更新任务
  - id: update_ipam_address
    type: cron
    module: tasks.update_ipam_address
    function: run
    schedule: "0 2 * * *"  # 每天凌晨2点执行
    description: "从采集数据更新IPAM地址表"
    enabled: true
  - id: backup_all_devices
    type: cron
    module: tasks.backup_device_config
    function: run
    schedule: "0 22 * * *"  # 每天凌晨10点执行
    description: "从采集数据更新IPAM地址表"
    enabled: true
  # 示例：间隔任务（默认禁用）
  # - id: example_interval_task
  #   type: interval
  #   module: tasks.example_task
  #   function: run
  #   schedule:
